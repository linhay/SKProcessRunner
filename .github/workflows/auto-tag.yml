name: Auto Tag

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next tag
        shell: bash
        env:
          TAG_PREFIX: ""
        run: |
          set -euo pipefail

          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "${TAG_PREFIX}" ]]; then
            TAG_REGEX="^${TAG_PREFIX}[0-9]+\\.[0-9]+\\.[0-9]+$"
          else
            TAG_REGEX="^[0-9]+\\.[0-9]+\\.[0-9]+$"
          fi

          # Skip if this commit is already tagged (prevents re-run from creating extra tags).
          if git tag --points-at "${GITHUB_SHA}" | grep -Eq "${TAG_REGEX}"; then
            echo "Commit ${GITHUB_SHA} already has a semver tag; skipping."
            exit 0
          fi

          next_tag() {
            local latest bare major minor patch
            latest="$(git tag --list | grep -E "${TAG_REGEX}" | sed "s/^${TAG_PREFIX}//" | sort -V | tail -n 1 || true)"
            if [[ -z "${latest}" ]]; then
              echo "${TAG_PREFIX}0.0.1"
              return 0
            fi

            IFS='.' read -r major minor patch <<<"${latest}"
            patch="$((patch + 1))"
            echo "${TAG_PREFIX}${major}.${minor}.${patch}"
          }

          for attempt in 1 2 3 4 5; do
            tag="$(next_tag)"
            if git rev-parse "${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists; refetching and retrying (${attempt}/5)."
              git fetch --tags --force
              continue
            fi

            git tag "${tag}" "${GITHUB_SHA}"
            if git push origin "${tag}"; then
              echo "Pushed tag ${tag}."
              exit 0
            fi

            echo "Failed to push tag ${tag}; retrying (${attempt}/5)."
            git tag -d "${tag}" >/dev/null 2>&1 || true
            git fetch --tags --force
          done

          echo "Failed to create/push a tag after 5 attempts."
          exit 1
